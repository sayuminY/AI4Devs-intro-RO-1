<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse String</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, .result {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .result {
            background-color: #f9f9f9;
            min-height: 38px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button.copy {
            background-color: #2196F3;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        .copy-message {
            color: green;
            font-size: 12px;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .copy-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>Reverse String</h1>
    
    <div class="input-group">
        <label for="inputText">Ingresa un texto:</label>
        <input type="text" id="inputText" placeholder="Escribe al menos 3 caracteres">
    </div>
    
    <div class="input-group">
        <label>Invertido en tiempo real:</label>
        <div class="result" id="realtimeResult"></div>
    </div>
    
    <div class="buttons">
        <button id="reverseBtn" disabled>Invertir</button>
        <button id="copyBtn" class="copy" disabled>Copiar texto invertido</button>
    </div>
    <div id="copyMessage" class="copy-message">¡Texto copiado al portapapeles!</div>
    
    <div class="input-group">
        <label>Resultado:</label>
        <div class="result" id="finalResult"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
